<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon says Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Simon Says Game</h1>
    <h2>Please press any Key to start the game</h2>
    <div class="btn-container">

        <div class="box-1">
            <div class="btns red"  type="button " id="red">1</div>
            <div class="btns green"  type="button" id="green">3</div>
        </div>

        <div class="box-2">
            <div class="btns yellow"  type="button" id="yellow">2</div>
            <div class="btns purple"  type="button" id="purple">4</div>            
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
